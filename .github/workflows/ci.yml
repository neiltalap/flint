name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config wayland-protocols libwayland-dev libvulkan-dev
      - name: Build
        run: make
      - name: Check
        run: make check
      - name: Ensure all sources compiled
        run: |
          status=0
          for f in main.c src/*.c src/*.cpp; do
            [ -e "$f" ] || continue
            obj="${f%.*}.o"
            if [ ! -f "$obj" ]; then
              echo "$f was not compiled" >&2
              status=1
            fi
          done
          exit "$status"
      - name: Ensure no generated files committed
        run: |
          if git ls-files 'generated/*' | grep -q .; then
            echo "generated files are tracked" >&2
            exit 1
          fi
